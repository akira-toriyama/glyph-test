# TEMPORARY — lint-floor rehearsal (t-5xyp). Deliberately mirrors the pre-gosec
# 8-linter template pare/rundiff carried: gosec is absent here, so it runs ONLY
# if the go-ci floor's `--enable` actually adds it. Delete after the rehearsal.
version: "2"

run:
  timeout: 3m

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - unconvert
    - revive
  settings:
    gosec:
      # Direction B of the rehearsal: gosec is STILL not in `enable` above —
      # only the go-ci floor's `--enable` turns it on. These includes must
      # nonetheless scope it (G306 must stop firing), proving repo settings
      # compose with a floor-enabled linter instead of being replaced.
      includes:
        - G204 # subprocess launched with a non-constant argument
        - G304 # file read from a non-constant path

formatters:
  enable:
    - gofmt
    - goimports
