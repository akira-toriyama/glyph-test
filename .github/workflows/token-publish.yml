name: token-publish

# Drill (glyph t-7404): publish a draft release using the workflow's own
# GITHUB_TOKEN, so tag-probe can show whether a GITHUB_TOKEN publish creates a
# tag that starts further workflow runs. Manual only.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Draft release tag to publish"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: publish the draft with GITHUB_TOKEN
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" --repo "$REPO" --draft=false
          gh release view "$TAG" --repo "$REPO" --json tagName,isDraft,targetCommitish
