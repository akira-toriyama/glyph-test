name: token-publish

# Publish a draft release with the workflow's own GITHUB_TOKEN. Manual only.
#
# Born as a drill (glyph t-7404) beside tag-probe.yml, which listened on
# push:tags / create / release to see whether the tag such a publish creates
# starts any workflow. Answered 2026-09-25 on v2.0.0: the tag appears, and
# nothing fires — glyph docs/DESIGN.md §4 records it. The probe is gone; this
# stays because the rollout runbook publishes this repository's drafts with it.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Draft release tag to publish"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: publish the draft with GITHUB_TOKEN
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" --repo "$REPO" --draft=false
          gh release view "$TAG" --repo "$REPO" --json tagName,isDraft,targetCommitish
