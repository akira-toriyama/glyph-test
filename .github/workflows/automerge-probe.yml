# Probe for the fleet auto-merge design (projects e-xj9m): who is the actor when
# GITHUB_TOKEN arms auto-merge? GitHub documents that events raised WITH the
# token create no workflow run, but not whether an auto-merge the token merely
# ARMED counts — GitHub performs that merge later, once the required checks
# pass. This job arms auto-merge (squash) with GITHUB_TOKEN so the landed merge
# commit, and the push runs it does or does not raise (Release, commit-lint),
# can be read back. The measurement lives in the epic body, not here.
#
# Fires for pull requests from `probe/automerge-token/*` branches only (any
# other pull skips the job), and by hand with a pull number. Prints the merge
# state BEFORE arming: gh merges outright when the pull is already mergeable,
# so a CLEAN state here means the direct-merge path ran, not the armed one.

name: automerge-probe

on:
  pull_request:
    types: [opened]
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number to arm auto-merge on"
        required: true
        type: string

jobs:
  arm:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'probe/automerge-token/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      # No checkout: gh talks to the API, nothing here reads the tree.
      - name: Arm auto-merge (squash) with GITHUB_TOKEN
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
        run: |
          set -euo pipefail
          echo "mergeStateStatus before arming: $(gh pr view "$PR" --repo "$REPO" --json mergeStateStatus --jq .mergeStateStatus)"
          gh pr merge "$PR" --repo "$REPO" --auto --squash
          gh pr view "$PR" --repo "$REPO" --json autoMergeRequest,mergeStateStatus,state
