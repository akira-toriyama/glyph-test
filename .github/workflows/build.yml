# Repo-specific, NOT fleet-managed: glyph-test is where the go-bite gate is fired
# with live ammunition. The gate asks one question of every pull request that
# touches shipping source — do the tests it adds still pass against the source
# before it? — and fails the ones that prove nothing.
#
# The pin is the hub branch under test while go-bite is being proven; it moves to
# @v2 once akira-toriyama/.github#124 merges.
name: build

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bite:
    uses: akira-toriyama/.github/.github/workflows/go-bite.yml@feat/go-bite-gate
    with:
      go-version-file: go.mod
