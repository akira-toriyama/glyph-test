# Repo-specific, NOT fleet-managed: glyph-test is where the go-bite gate is fired
# with live ammunition. The gate asks one question of every pull request that
# touches shipping source — do the tests it adds still pass against the source
# before it? — and fails the ones that prove nothing.
#
# The gate is released, so this rides the fleet's moving @v2 like every other
# reusable — proving the same path the rest of the fleet takes rather than a branch.
name: build

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bite:
    uses: akira-toriyama/.github/.github/workflows/go-bite.yml@v2
    with:
      go-version-file: go.mod
