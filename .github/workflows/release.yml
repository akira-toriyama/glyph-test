name: Release

# glyph-test demo release — the verdict + rolling-DRAFT half of glyph's
# reusable release.yml, without the Swift app build (this repo ships
# no binary). A push to main makes `glyph release` walk main's squash
# commits since the last v* tag, resolve each to its merged PR over the API,
# classify the PR's individual (pre-squash) commits — squash-safe — and
# upsert ONE glyph-managed rolling DRAFT release. No git tag is created
# until a human publishes the draft. Installing through glyph's own
# `actions/install` composite (pinned tag, checksum + provenance fail-closed)
# means the demo exercises the real supply-chain path rather than a copy of it.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only (no draft write)"
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # A CALLER, not a hand copy. This file used to inline glyph's own release
  # reusable — the walk, the rolling-draft upsert, the soft-no-release fold —
  # which made the demo a copy of the thing it exists to demonstrate, free to
  # drift from it silently. glyph's reusable grew a verdict-only mode for
  # exactly this (glyph #93: neither `app` nor `binary` is a third mode, not an
  # error), and the shape was proven on branch drill/t-kcm4-verdict-only before
  # it came here.
  #
  # No `glyph-version`. The drill branch had to pass one because it pinned a
  # SHA, and the reusable refuses to guess a binary version from a non-tag ref.
  # A TAG pin needs no override — the reusable derives the binary from
  # job.workflow_ref, so @v1.0.0 runs binary v1.0.0 by construction and the two
  # cannot drift. Passing it anyway would reintroduce the hand-bumped default
  # this repo has already been bitten by.
  release:
    uses: akira-toriyama/glyph/.github/workflows/release.yml@v3.0.0-rc.2
    with:
      # No `app`, no `binary` — the verdict-only mode.
      dry-run: ${{ github.event.inputs.dry_run == 'true' }}
      install-notes: |
        ## Install

        Nothing to install — glyph-test is a demo; the release IS the artifact.
    permissions:
      contents: write

  # The read-back assert does not come free with the reusable: it lives in the
  # caller, and it stays here. Moving it into the reusable would make all seven
  # consumers count their own artefact, which is the better end state — but it
  # is a new fleet-visible failure mode, so it is a separate decision and not a
  # side effect of this one.
  read-back:
    needs: release
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # write, though this job only reads. A GITHUB_TOKEN with `contents: read`
      # sees ZERO draft releases — GitHub exposes drafts only to push access —
      # so the listing came back empty and the assert read it as "the draft is
      # gone". Measured on run 30737721992. Any read-back that concludes
      # anything from a COUNT of drafts has to hold this permission, or its
      # zero is a statement about the token and not about the repository.
      contents: write
    steps:
      - name: Read the release back and assert exactly one managed draft
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail
          export DRAFT_RE='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            | jq -s 'add | [.[] | select(.draft) | select(.tag_name | test(env.DRAFT_RE))]' \
            > managed.json
          n=$(jq length managed.json)
          jq -r '.[] | "  id=\(.id) tag=\(.tag_name) name=\(.name) target=\(.target_commitish)"' managed.json
          if [ "$n" -ne 1 ]; then
            echo "::error::$n glyph-managed drafts exist, want exactly 1"
            exit 1
          fi
          if [ "${DRY_RUN:-}" = "true" ]; then
            echo "dry run: the draft above must be UNCHANGED by this run."
            exit 0
          fi
          got_target=$(jq -r '.[0].target_commitish' managed.json)
          if [ "$got_target" != "$GITHUB_SHA" ]; then
            echo "::error::target_commitish is $got_target, but this run's commit is $GITHUB_SHA"
            exit 1
          fi
          echo "read back OK — the draft the REUSABLE wrote targets this run's commit"
